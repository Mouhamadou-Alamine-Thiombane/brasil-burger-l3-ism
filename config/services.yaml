# # Put parameters here that don't need to change on each machine where the app is deployed
# # https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
# parameters:

# services:
#     # default configuration for services in *this* file
#     _defaults:
#         autowire: true      # Automatically injects dependencies in your services.
#         autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

#     # makes classes in src/ available to be used as services
#     # this creates a service per class whose id is the fully-qualified class name
#     App\:
#         resource: '../src/'

#     # add more service definitions when explicit configuration is needed
#     # please note that last definitions always *replace* previous ones

# This file is the entry point to configure your own services.
services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # Configuration des contrôleurs
    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    # Configuration des services
    App\Service\:
        resource: '../src/Service/'
        exclude: '../src/Service/{DTO,Exception}'

    # Configuration des repositories
    App\Repository\:
        resource: '../src/Repository/'
        tags: ['doctrine.repository_service']

    # Configuration des entités
    App\Entity\:
        resource: '../src/Entity/'
        exclude: '../src/Entity/{DTO,Exception}'

    # Configuration spécifique des services
    App\Service\Interface\StatistiqueServiceInterface:
        class: App\Service\Impl\StatistiqueServiceImpl

    App\Service\Interface\CommandeServiceInterface:
        class: App\Service\Impl\CommandeServiceImpl

    App\Service\Interface\ProduitServiceInterface:
        class: App\Service\Impl\ProduitServiceImpl

    App\Service\Interface\ClientServiceInterface:
        class: App\Service\Impl\ClientServiceImpl

    App\Service\Interface\LivraisonServiceInterface:
        class: App\Service\Impl\LivraisonServiceImpl